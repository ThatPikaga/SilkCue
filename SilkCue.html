<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SilkCue - Free Open Source Line Learning for Actors</title>
<meta name="theme-color" content="#14110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SilkCue">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2314110d'/%3E%3Ccircle cx='50' cy='42' r='26' fill='%23c9a15a' opacity='0.9'/%3E%3Crect x='20' y='72' width='60' height='6' fill='%23efe7d6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
<style>
  :root{
    --stage:#14110d;
    --stage-2:#1b1712;
    --stage-3:#211c15;
    --curtain:#7a2331;
    --curtain-bright:#a8324a;
    --brass:#c9a15a;
    --brass-bright:#e3c583;
    --paper:#efe7d6;
    --paper-2:#e6dabe;
    --ink:#2b2420;
    --ink-soft:#6b5f50;
    --cream:#f4ecd8;
    --line:rgba(201,161,90,0.22);
    --danger:#c1543c;
    --good:#5f8a6c;
    --radius:3px;
    --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
    --font-body:'Source Serif 4',Georgia,'Times New Roman',serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--stage);
    color:var(--cream);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  @media (prefers-color-scheme:light){ body{ background:var(--stage); color:var(--cream); } }
  #app{min-height:100%;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  a{color:inherit}
  ::selection{background:var(--brass);color:var(--stage)}

  .shell{
    width:100%;
    max-width:640px;
    margin:0 auto;
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:14px 18px;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--stage-2),var(--stage));
    position:sticky;top:0;z-index:20;
  }
  .topbar .icon-btn{
    background:none;border:1px solid transparent;color:var(--brass);
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:18px;flex:none;
  }
  .topbar .icon-btn:active{background:rgba(201,161,90,0.12)}
  .topbar .title{
    font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.01em;
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--cream);
  }
  .topbar .sub{display:block;font-family:var(--font-body);font-weight:400;font-size:11.5px;color:var(--brass);margin-top:1px;letter-spacing:.02em}

  /* ---------- Generic layout ---------- */
  .screen{flex:1;display:flex;flex-direction:column;min-height:0}
  .pad{padding:20px 18px 32px}
  .center-stage{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px 24px;position:relative;
  }
  .spotlight{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 60% 40% at 50% 18%, rgba(201,161,90,0.16), transparent 65%);
  }
  .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--brass);text-transform:uppercase;margin:0 0 10px}
  h1.hero{
    font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.12;
    margin:0 0 12px;color:var(--cream);
  }
  .lede{font-size:15.5px;color:#cabfa9;line-height:1.55;max-width:38ch;margin:0 auto 26px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 22px;border-radius:var(--radius);border:1px solid transparent;
    font-size:15px;font-weight:600;letter-spacing:.01em;transition:transform .12s ease,opacity .12s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--brass);color:#1c1509;border-color:var(--brass)}
  .btn-primary:disabled{opacity:.4}
  .btn-ghost{background:transparent;color:var(--brass-bright);border-color:var(--line)}
  .btn-ghost:active{background:rgba(201,161,90,0.08)}
  .btn-danger{background:transparent;color:var(--danger);border-color:rgba(193,84,60,.4)}
  .btn-block{width:100%}
  .btn-sm{padding:9px 14px;font-size:13.5px}

  .dropzone{
    width:100%;border:1.5px dashed var(--line);border-radius:6px;
    padding:30px 18px;text-align:center;color:#b9ad95;font-size:14px;
    background:rgba(255,255,255,0.015);transition:border-color .15s,background .15s;
  }
  .dropzone.drag{border-color:var(--brass);background:rgba(201,161,90,0.06)}
  .or-row{display:flex;align-items:center;gap:12px;color:#7d715f;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:18px 0}
  .or-row::before,.or-row::after{content:"";flex:1;height:1px;background:var(--line)}

  textarea.script-paste{
    width:100%;min-height:140px;background:var(--stage-3);border:1px solid var(--line);
    border-radius:6px;color:var(--cream);padding:12px;font-size:13.5px;line-height:1.5;resize:vertical;
  }
  textarea.script-paste:focus{outline:none;border-color:var(--brass)}

  .field-label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);margin:18px 0 8px}
  input.text-input{
    width:100%;background:var(--stage-3);border:1px solid var(--line);border-radius:6px;
    color:var(--cream);padding:11px 12px;font-size:15px;
  }
  input.text-input:focus{outline:none;border-color:var(--brass)}

  /* ---------- Main menu ---------- */
  .continue-card{
    margin:18px 18px 6px;padding:18px;border-radius:8px;
    background:linear-gradient(135deg,var(--curtain) 0%, #5a1a24 100%);
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:0 14px 30px rgba(0,0,0,.35);
  }
  .continue-card .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#f0c9c9;opacity:.85}
  .continue-card h3{font-family:var(--font-display);margin:4px 0 2px;font-size:20px;color:#fff}
  .continue-card p{margin:0 0 14px;font-size:13.5px;color:#f2dede;opacity:.9}

  .list-heading{
    padding:22px 18px 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8a7d68;
  }
  .script-card{
    display:flex;align-items:center;gap:13px;
    margin:0 14px 10px;padding:14px;border-radius:8px;
    background:var(--stage-2);border:1px solid var(--line);
    text-align:left;width:calc(100% - 28px);
  }
  .script-card:active{background:var(--stage-3)}
  .script-card .swatch{
    width:40px;height:52px;flex:none;border-radius:2px;
    background:linear-gradient(160deg,var(--paper),var(--paper-2));
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-family:var(--font-display);font-weight:700;font-size:16px;
    box-shadow:2px 3px 0 rgba(0,0,0,.25);
  }
  .script-card .meta{flex:1;min-width:0}
  .script-card .meta .name{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .script-card .meta .sub{font-size:12.5px;color:#8a7d68;margin-top:2px}
  .script-card .chev{color:var(--brass);opacity:.7;font-size:18px}
  .fab-add{
    margin:6px 14px 20px;padding:14px;border-radius:8px;
    border:1.5px dashed var(--line);background:transparent;color:var(--brass-bright);
    display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:600;width:calc(100% - 28px);
  }

  /* ---------- Character select ---------- */
  .char-grid{padding:6px 14px 100px;display:flex;flex-direction:column;gap:9px}
  .char-card{
    display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:8px;
    background:var(--stage-2);border:1.5px solid var(--line);text-align:left;width:100%;
  }
  .char-card.selected{border-color:var(--brass);background:rgba(201,161,90,0.10)}
  .char-card .mark{
    width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .char-card.selected .mark{background:var(--brass);border-color:var(--brass);color:var(--stage)}
  .char-card .cinfo{flex:1;min-width:0}
  .char-card .cinfo .nm{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--cream)}
  .char-card .cinfo .ln{font-size:12px;color:#8a7d68;margin-top:2px}
  .char-card .editbtn{flex:none;color:var(--brass);opacity:.65;font-size:13px;padding:4px 8px}

  .sticky-footer{
    position:sticky;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(0deg,var(--stage) 60%,transparent);
    display:flex;gap:10px;
  }

  /* ---------- Rehearsal screen ---------- */
  .rehearsal-head{
    padding:10px 18px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line);background:var(--stage-2);
  }
  .rehearsal-head .who{flex:1;min-width:0}
  .rehearsal-head .who .role{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
  .rehearsal-head .who .pg{font-size:12px;color:#8a7d68;margin-top:1px}

  .page-panel{
    flex:1;overflow-y:auto;background:radial-gradient(ellipse at 50% 0%, #1d1811, var(--stage) 60%);
    padding:18px 16px 140px;
  }
  .script-sheet{
    max-width:100%;margin:0 auto;background:var(--paper);color:var(--ink);
    border-radius:4px;padding:22px 18px;box-shadow:0 18px 40px rgba(0,0,0,.45);
    font-size:15px;line-height:1.6;
  }
  .cue-line{margin:0 0 13px;padding:2px 0}
  .cue-line.ctx{opacity:.55}
  .cue-line .who{font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:13px;color:var(--ink)}
  .cue-line .txt{display:inline}
  .cue-line.direction{font-style:italic;text-align:center;color:var(--ink-soft);font-size:13.5px}
  .cue-line.heading{
    text-align:center;font-family:var(--font-display);font-weight:700;color:var(--curtain);
    text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin:18px 0 12px;
  }
  .cue-line.mine{
    background:linear-gradient(90deg,rgba(122,35,49,0.10),transparent);
    border-left:3px solid var(--curtain);padding:8px 10px;margin:6px -10px 13px;border-radius:0 4px 4px 0;
  }
  .cue-line.mine .who{color:var(--curtain)}
  .cue-line.mine.hidden-text .txt{
    background:var(--ink);color:var(--ink);border-radius:3px;user-select:none;
  }
  .cue-line.current{outline:2px solid var(--brass);outline-offset:4px;border-radius:4px}
  .cue-line .matchbar{height:4px;border-radius:2px;background:rgba(0,0,0,.12);margin-top:7px;overflow:hidden}
  .cue-line .matchbar > i{display:block;height:100%;background:var(--good);width:0%;transition:width .25s ease}
  .heard{font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-style:italic}

  .transport{
    position:sticky;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(0deg,var(--stage) 55%,transparent);
    display:flex;flex-direction:column;gap:10px;
  }
  .status-row{display:flex;align-items:center;gap:10px;justify-content:center;font-size:12.5px;color:#b9ad95;min-height:16px}
  .pulse-dot{width:9px;height:9px;border-radius:50%;background:#6b5f50;flex:none}
  .pulse-dot.listening{background:var(--curtain-bright);animation:pulse 1.1s ease-in-out infinite}
  .pulse-dot.speaking{background:var(--brass);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
  .ctrl-row{display:flex;gap:8px}
  .ctrl-row .btn{flex:1}
  .icon-only{width:46px;flex:none;padding:0}

  /* ---------- Modal ---------- */
  .modal-back{
    position:fixed;inset:0;background:rgba(10,8,5,0.72);display:flex;align-items:flex-end;justify-content:center;
    z-index:50;animation:fadein .15s ease;
  }
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .modal-card{
    width:100%;max-width:640px;background:var(--stage-2);border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -20px 50px rgba(0,0,0,.5);
  }
  .modal-card.center{border-radius:12px;margin-bottom:auto;margin-top:auto}
  .modal-card h3{font-family:var(--font-display);margin:0 0 8px;font-size:19px;color:var(--cream)}
  .modal-card p{font-size:14px;color:#c4b9a3;line-height:1.5;margin:0 0 18px}
  .modal-actions{display:flex;gap:10px}
  .modal-actions .btn{flex:1}

  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--stage-3);border:1px solid var(--line);
    border-radius:20px;padding:5px 10px 5px 12px;font-size:12.5px;color:#dccdae;
  }
  .chip button{background:none;border:none;color:#9a8d76;font-size:13px;padding:0;line-height:1}

  select.text-input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--brass) 50%),linear-gradient(135deg,var(--brass) 50%,transparent 50%);background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

  .banner{
    margin:0 18px 14px;padding:11px 13px;border-radius:6px;font-size:13px;line-height:1.4;
    background:rgba(193,84,60,0.12);border:1px solid rgba(193,84,60,0.35);color:#e8c3b8;
  }
  .banner.info{background:rgba(201,161,90,0.10);border-color:var(--line);color:#e3d3ae}

  .empty-icon{font-size:40px;margin-bottom:6px;opacity:.9}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
  .settings-row:last-child{border-bottom:none}
  .settings-row .lbl{font-size:14.5px;color:var(--cream)}
  .settings-row .desc{font-size:12px;color:#8a7d68;margin-top:2px}
  .switch{width:42px;height:24px;border-radius:14px;background:var(--stage-3);border:1px solid var(--line);position:relative;flex:none}
  .switch.on{background:var(--brass)}
  .switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--cream);transition:left .15s ease}
  .switch.on i{left:20px;background:#1c1509}
  input[type=range]{width:100%;accent-color:var(--brass)}

  .scrim-hint{font-size:11.5px;color:#7d715f;text-align:center;margin-top:2px}
  @media (min-width:640px){ .shell{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   SilkCue - a line-learning rehearsal app for actors
   Single-file PWA. All state lives in localStorage on this device.
   ========================================================================= */
(function(){
"use strict";

/* ---------------------------------------------------------------------
   Storage
--------------------------------------------------------------------- */
var STORE_KEY = "cue.scripts.v1";
var LAST_KEY = "cue.last.v1";
var SETTINGS_KEY = "cue.settings.v1";

function loadScripts(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveScripts(list){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }catch(e){ console.warn("save failed", e); }
}
function loadLast(){
  try{ var raw = localStorage.getItem(LAST_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
}
function saveLast(obj){
  try{ localStorage.setItem(LAST_KEY, JSON.stringify(obj)); }catch(e){}
}
function loadSettings(){
  var defaults = { rate:1.0, autoSkip:true, hideOwnLines:false, matchThreshold:0.55, silenceMs:1600 };
  try{
    var raw = localStorage.getItem(SETTINGS_KEY);
    return raw ? Object.assign(defaults, JSON.parse(raw)) : defaults;
  }catch(e){ return defaults; }
}
function saveSettings(s){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }catch(e){} }

/* ---------------------------------------------------------------------
   Utils
--------------------------------------------------------------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function toTitle(s){
  return String(s).toLowerCase().replace(/\b([a-z])/g, function(m,c){ return c.toUpperCase(); });
}
function tokenize(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
}
function wordOverlap(expected, heard){
  var a = tokenize(expected), b = tokenize(heard);
  if(!a.length) return 0;
  var bSet = {};
  b.forEach(function(w){ bSet[w] = (bSet[w]||0)+1; });
  var hits = 0;
  a.forEach(function(w){ if(bSet[w] && bSet[w]>0){ hits++; bSet[w]--; } });
  return hits / a.length;
}
function debounce(fn, ms){
  var t=null;
  return function(){
    var args=arguments;
    clearTimeout(t);
    t=setTimeout(function(){ fn.apply(null,args); }, ms);
  };
}

/* ---------------------------------------------------------------------
   Alias grouping that merges cue labels like "BEN" / "UNCLE BEN" or
   "Jones" / "DR. Jones" into one character.
--------------------------------------------------------------------- */
var TITLE_WORDS = ["DR","DOCTOR","CAPTAIN","CAPT","MRS","MR","MS","MISS","REVEREND","REV",
  "SQUIRE","SIR","LORD","LADY","FATHER","MOTHER","OLD","YOUNG","THE"];

function normName(raw){
  return String(raw||"").replace(/\.+$/,"").replace(/\s+/g," ").trim().toUpperCase();
}
function coreWordSet(raw){
  var words = normName(raw).split(" ").filter(Boolean);
  var core = words.filter(function(w){ return TITLE_WORDS.indexOf(w.replace(/[^A-Z]/g,"")) === -1; });
  if(!core.length) core = words;
  return core;
}
function setsIntersect(a,b){
  for(var i=0;i<a.length;i++){ if(b.indexOf(a[i])!==-1) return true; }
  return false;
}

// groups: array of {ids:[rawNameNormalized...], count, canonical}
function mergeAliasGroups(rawCounts){
  // rawCounts: {NORMALIZED_NAME: count}
  var names = Object.keys(rawCounts);
  var groups = names.map(function(n){ return { members:[n], count: rawCounts[n] }; });

  var merged = true;
  while(merged){
    merged = false;
    outer:
    for(var i=0;i<groups.length;i++){
      for(var j=i+1;j<groups.length;j++){
        var gi = groups[i], gj = groups[j];
        var hit = false;
        for(var x=0;x<gi.members.length && !hit;x++){
          var cwx = coreWordSet(gi.members[x]);
          for(var y=0;y<gj.members.length && !hit;y++){
            var cwy = coreWordSet(gj.members[y]);
            if(setsIntersect(cwx,cwy)) hit = true;
          }
        }
        if(hit){
          gi.members = gi.members.concat(gj.members);
          gi.count += gj.count;
          groups.splice(j,1);
          merged = true;
          break outer;
        }
      }
    }
  }
  groups.forEach(function(g){
    // canonical = longest member name (most descriptive), title-cased word by word
    g.members.sort(function(a,b){ return b.length - a.length; });
    g.canonical = toTitle(g.members[0]);
  });
  return groups;
}

/* ---------------------------------------------------------------------
   Parser: structured HTML export (e.g. class="char" / class="page")
--------------------------------------------------------------------- */
function looksLikeStructuredHTML(doc){
  return !!doc.querySelector('.char, span.char, [class*="char"]');
}

function parseStructuredHTML(doc){
  var pageEls = doc.querySelectorAll(".page");
  var pages = pageEls.length ? Array.prototype.slice.call(pageEls) : [doc.body];
  var rawCues = []; // {pageNum, type, characterRaw, text}
  var pageNum = 0;

  pages.forEach(function(pageEl, idx){
    pageNum = idx+1;
    var numEl = pageEl.querySelector ? pageEl.querySelector(".page-num") : null;
    if(numEl && /^\d+$/.test(numEl.textContent.trim())) pageNum = parseInt(numEl.textContent.trim(),10);

    var kids = pageEl.querySelectorAll ? pageEl.querySelectorAll("p,h1,h2,h3,h4,li") : [];
    kids.forEach(function(el){
      var cls = (el.className||"")+"";
      var text = el.textContent.replace(/\s+/g," ").trim();
      if(!text) return;

      if(/^h[1-4]$/i.test(el.tagName)){
        rawCues.push({ pageNum:pageNum, type:"heading", characterRaw:null, text:text });
        return;
      }
      if(/\bdir\b/.test(cls)){
        rawCues.push({ pageNum:pageNum, type:"direction", characterRaw:null, text:text });
        return;
      }
      var charEl = el.querySelector ? el.querySelector('.char, [class*="char"]') : null;
      if(charEl){
        var name = charEl.textContent.replace(/\.+\s*$/,"").trim();
        var rest = text.slice(charEl.textContent.trim().length).replace(/^[\s.:—-]+/,"").trim();
        if(!rest) rest = text;
        rawCues.push({ pageNum:pageNum, type:"line", characterRaw: normName(name), text: rest });
        return;
      }
      // fallback regex: "NAME. rest" or "NAME: rest" at start of paragraph
      var m = text.match(/^([A-Z][A-Z'.\s]{1,28}?)[.:]\s+(.+)$/);
      if(m && m[1].replace(/[^A-Z]/g,"").length>=2){
        rawCues.push({ pageNum:pageNum, type:"line", characterRaw: normName(m[1]), text:m[2] });
      } else {
        rawCues.push({ pageNum:pageNum, type:"text", characterRaw:null, text:text });
      }
    });
  });
  return rawCues;
}

/* ---------------------------------------------------------------------
   Parser: generic plain-text (paste / txt / pdf-extracted pages)
   pagesArray: [{pageNum, text, estimated}]
--------------------------------------------------------------------- */
function parseGenericPages(pagesArray){
  var rawCues = [];
  var patternColon = /^([A-Z][A-Za-z'.\s]{1,28}?)\s*:\s*(.+)$/;
  var patternCapsPeriod = /^([A-Z][A-Z'.\s]{1,28}?)\.\s+(.+)$/;
  var patternCapsAlone = /^([A-Z][A-Z' .]{1,28})$/;

  pagesArray.forEach(function(pg){
    var lines = pg.text.split(/\r?\n/);
    var pendingSpeaker = null;
    for(var i=0;i<lines.length;i++){
      var line = lines[i].replace(/\s+/g," ").trim();
      if(!line) { continue; }

      if(/^\(.*\)$/.test(line) || /^\[.*\]$/.test(line)){
        rawCues.push({ pageNum:pg.pageNum, type:"direction", characterRaw:null, text:line.replace(/^[\(\[]|[\)\]]$/g,"") });
        pendingSpeaker = null;
        continue;
      }
      var mc = line.match(patternColon);
      var mp = !mc && line.match(patternCapsPeriod);
      if(mc && mc[1].replace(/[^A-Za-z]/g,"").length>=2){
        rawCues.push({ pageNum:pg.pageNum, type:"line", characterRaw: normName(mc[1]), text: mc[2] });
        pendingSpeaker = null;
        continue;
      }
      if(mp && mp[1].replace(/[^A-Z]/g,"").length>=2 && mp[1] === mp[1].toUpperCase()){
        rawCues.push({ pageNum:pg.pageNum, type:"line", characterRaw: normName(mp[1]), text: mp[2] });
        pendingSpeaker = null;
        continue;
      }
      var ma = line.match(patternCapsAlone);
      if(ma && line.split(" ").length<=5){
        pendingSpeaker = normName(ma[1]);
        continue;
      }
      if(pendingSpeaker){
        rawCues.push({ pageNum:pg.pageNum, type:"line", characterRaw: pendingSpeaker, text: line });
        continue;
      }
      rawCues.push({ pageNum:pg.pageNum, type:"text", characterRaw:null, text:line });
    }
  });
  return rawCues;
}

/* ---------------------------------------------------------------------
   Turn raw cues into a finished Script object (characters + cue list)
--------------------------------------------------------------------- */
function buildScriptFromRawCues(rawCues, meta){
  var counts = {};
  rawCues.forEach(function(c){
    if(c.type==="line" && c.characterRaw){
      counts[c.characterRaw] = (counts[c.characterRaw]||0)+1;
    }
  });
  var groups = mergeAliasGroups(counts);
  var idByMember = {};
  groups.forEach(function(g,gi){
    var gid = "c"+gi;
    g.id = gid;
    g.members.forEach(function(m){ idByMember[m]=gid; });
  });

  var cues = rawCues.map(function(c, i){
    var characterId = (c.type==="line" && c.characterRaw) ? idByMember[c.characterRaw] : null;
    return {
      id: "l"+i,
      page: c.pageNum,
      type: c.type,
      characterId: characterId,
      characterRaw: c.characterRaw,
      text: c.text
    };
  });

  var characters = groups.map(function(g){
    var firstCue = cues.filter(function(c){ return c.characterId===g.id; })[0];
    return {
      id: g.id,
      name: g.canonical,
      aliases: g.members.map(toTitle),
      lineCount: g.count,
      firstPage: firstCue ? firstCue.page : 1
    };
  }).sort(function(a,b){ return b.lineCount - a.lineCount; });

  var allHeadings = cues.filter(function(c){ return c.type==="heading"; }).map(function(c){
    return { cueId:c.id, page:c.page, text:c.text };
  });
  var sceneHeadings = allHeadings.filter(function(h){ return /^(act|scene)\b/i.test(h.text); });
  var headings = sceneHeadings.length ? sceneHeadings : allHeadings;

  return {
    id: uid(),
    name: meta.name || "Untitled Script",
    addedAt: Date.now(),
    sourceType: meta.sourceType || "text",
    estimatedPages: !!meta.estimatedPages,
    cues: cues,
    characters: characters,
    headings: headings
  };
}

/* ---------------------------------------------------------------------
   File readers
--------------------------------------------------------------------- */
function readFileAsText(file){
  return new Promise(function(resolve,reject){
    var fr = new FileReader();
    fr.onload = function(){ resolve(fr.result); };
    fr.onerror = function(){ reject(fr.error); };
    fr.readAsText(file);
  });
}
function readFileAsArrayBuffer(file){
  return new Promise(function(resolve,reject){
    var fr = new FileReader();
    fr.onload = function(){ resolve(fr.result); };
    fr.onerror = function(){ reject(fr.error); };
    fr.readAsArrayBuffer(file);
  });
}

function extractPdfPages(arrayBuffer){
  if(typeof pdfjsLib === "undefined"){
    return Promise.reject(new Error("PDF reader didn't load. Try pasting the script text instead."));
  }
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
  }catch(e){}
  return pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(function(pdf){
    var pagePromises = [];
    for(var p=1;p<=pdf.numPages;p++){
      pagePromises.push((function(pageNum){
        return pdf.getPage(pageNum).then(function(page){
          return page.getTextContent().then(function(content){
            // group items into lines by y-position
            var rows = [];
            var lastY = null, cur = [];
            content.items.forEach(function(item){
              var y = Math.round(item.transform[5]);
              if(lastY===null || Math.abs(y-lastY)>3){
                if(cur.length) rows.push(cur.join(" "));
                cur = [item.str];
                lastY = y;
              } else {
                cur.push(item.str);
              }
            });
            if(cur.length) rows.push(cur.join(" "));
            return { pageNum:pageNum, text: rows.join("\n") };
          });
        });
      })(p));
    }
    return Promise.all(pagePromises);
  });
}

/* ---------------------------------------------------------------------
   Speech: text-to-speech
--------------------------------------------------------------------- */
var VoiceEngine = (function(){
  var voices = [];
  function refresh(){
    try{ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }catch(e){ voices=[]; }
  }
  if(window.speechSynthesis){
    refresh();
    window.speechSynthesis.onvoiceschanged = refresh;
  }
  function hash(str){
    var h=0; for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i))|0; }
    return Math.abs(h);
  }
  function voiceFor(characterId){
    if(!voices.length) return null;
    var english = voices.filter(function(v){ return /^en/i.test(v.lang); });
    var pool = english.length ? english : voices;
    return pool[hash(characterId) % pool.length];
  }
  function pitchFor(characterId){
    var h = hash(characterId+"p");
    return 0.85 + (h % 30)/100; // 0.85 - 1.14
  }
  var supported = !!window.speechSynthesis;
  var current = null;
  function speak(text, characterId, rate, onend){
    if(!supported || !text){ if(onend) onend(); return; }
    try{
      var u = new SpeechSynthesisUtterance(text);
      var v = voiceFor(characterId||"narrator");
      if(v) u.voice = v;
      u.pitch = pitchFor(characterId||"narrator");
      u.rate = rate || 1.0;
      u.onend = function(){ current=null; if(onend) onend(); };
      u.onerror = function(){ current=null; if(onend) onend(); };
      current = u;
      window.speechSynthesis.speak(u);
    }catch(e){ if(onend) onend(); }
  }
  function stop(){
    try{ if(supported) window.speechSynthesis.cancel(); }catch(e){}
    current=null;
  }
  return { supported:supported, speak:speak, stop:stop };
})();

/* ---------------------------------------------------------------------
   Speech: speech-to-text (listens for the user's own lines)
--------------------------------------------------------------------- */
var ListenEngine = (function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var supported = !!SR;
  var rec = null, active = false;
  var onUpdate = null, onSilence = null, onError = null;
  var silenceTimer = null, silenceMs = 1600;
  var transcriptBuf = "";

  function armSilence(){
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(function(){
      if(active && onSilence) onSilence(transcriptBuf);
    }, silenceMs);
  }

  function start(opts){
    if(!supported) return false;
    opts = opts||{};
    silenceMs = opts.silenceMs || 1600;
    onUpdate = opts.onUpdate || null;
    onSilence = opts.onSilence || null;
    onError = opts.onError || null;
    transcriptBuf = "";
    try{
      rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "en-US";
      rec.onresult = function(ev){
        var text = "";
        for(var i=ev.resultIndex;i<ev.results.length;i++){
          text += ev.results[i][0].transcript + " ";
        }
        transcriptBuf = (transcriptBuf + " " + text).trim();
        if(onUpdate) onUpdate(transcriptBuf);
        armSilence();
      };
      rec.onerror = function(e){
        if(e.error === "no-speech"){ armSilence(); return; }
        active = false;
        clearTimeout(silenceTimer);
        if(onError) onError(e.error);
      };
      rec.onend = function(){
        if(active){
          try{ rec.start(); }catch(e){} // keep listening through brief engine restarts
        }
      };
      rec.start();
      active = true;
      armSilence();
      return true;
    }catch(e){ return false; }
  }
  function stop(){
    active = false;
    clearTimeout(silenceTimer);
    try{ if(rec) rec.stop(); }catch(e){}
  }
  function currentTranscript(){ return transcriptBuf; }
  return { supported:supported, start:start, stop:stop, currentTranscript:currentTranscript };
})();

/* ---------------------------------------------------------------------
   App state & router
--------------------------------------------------------------------- */
var state = {
  screen: "boot",          // boot | upload | menu | characters | rehearsal | settings
  scripts: [],
  activeScriptId: null,
  activeCharacterId: null,
  cueIndex: 0,
  mode: "idle",             // idle | speaking | listening | paused
  heard: "",
  matchPct: 0,
  modal: null,              // {type:'skip', targetIndex, targetPage} | {type:'end'} | {type:'error', msg}
  settings: loadSettings(),
  micDenied: false,
  pendingSelectChar: null,
  editingCharId: null,
  jumpOpen: false,
  skipDeclinedForIndex: null,
  importing: false
};

var root = document.getElementById("app");

function setState(patch){
  Object.assign(state, patch);
  render();
}

function currentScript(){
  return state.scripts.find(function(s){ return s.id===state.activeScriptId; }) || null;
}
function currentCharacter(){
  var s = currentScript();
  if(!s) return null;
  return s.characters.find(function(c){ return c.id===state.activeCharacterId; }) || null;
}

/* ---------------------------------------------------------------------
   Rehearsal engine
--------------------------------------------------------------------- */
function isMyLine(cue){ return cue && cue.type==="line" && cue.characterId===state.activeCharacterId; }

function findNextMyLineIndex(fromIndex){
  var s = currentScript();
  if(!s) return -1;
  for(var i=fromIndex;i<s.cues.length;i++){
    if(isMyLine(s.cues[i])) return i;
  }
  return -1;
}

function stopEngines(){
  VoiceEngine.stop();
  ListenEngine.stop();
}

function goToScreen(name){
  stopEngines();
  setState({ screen:name, modal:null, mode:"idle" });
}

function startRehearsal(scriptId, characterId, startIndex){
  stopEngines();
  var last = loadLast();
  last.scriptId = scriptId;
  last.characterId = characterId;
  saveLast(last);
  setState({
    screen:"rehearsal", activeScriptId:scriptId, activeCharacterId:characterId,
    cueIndex: startIndex||0, mode:"idle", heard:"", matchPct:0, modal:null,
    skipDeclinedForIndex:null
  });
  advance();
}

function pauseRehearsal(){
  stopEngines();
  setState({ mode:"paused" });
}
function resumeRehearsal(){
  setState({ mode:"idle" });
  advance();
}

function maybeOfferSkip(afterIndex, cb){
  var s = currentScript();
  // once we've actually reached/passed a previously-declined target, the suppression is stale — clear it
  if(state.skipDeclinedForIndex!==null && afterIndex > state.skipDeclinedForIndex){
    state.skipDeclinedForIndex = null;
  }
  if(!state.settings.autoSkip){ cb(); return; }
  var curPage = s.cues[Math.min(afterIndex, s.cues.length-1)] ? s.cues[Math.min(afterIndex, s.cues.length-1)].page : 1;
  var nextIdx = findNextMyLineIndex(afterIndex);
  if(nextIdx===-1){
    setState({ modal:{ type:"end" }, mode:"idle" });
    return;
  }
  if(nextIdx === state.skipDeclinedForIndex){ cb(); return; } // user already chose to read through this gap
  var nextPage = s.cues[nextIdx].page;
  if(nextPage - curPage >= 2){
    // jump target = a few cues before the next line, for context
    var ctxStart = nextIdx;
    var back = 0;
    while(ctxStart>0 && back<2){ ctxStart--; if(s.cues[ctxStart].type!=="text"){back++;} }
    setState({ modal:{ type:"skip", targetIndex: ctxStart, targetPage: nextPage, userLineIndex: nextIdx, resumeIndex: afterIndex } });
    return;
  }
  cb();
}

function advance(){
  var s = currentScript();
  if(!s){ return; }
  if(state.mode === "paused"){ return; }
  if(state.cueIndex >= s.cues.length){
    setState({ modal:{ type:"end" }, mode:"idle" });
    return;
  }
  var cue = s.cues[state.cueIndex];

  if(cue.type==="heading" || cue.type==="text"){
    setState({ mode:"idle" });
    afterAutoCue();
    return;
  }

  if(isMyLine(cue)){
    beginListening(cue);
    return;
  }

  // other character's line, or a direction — read it aloud
  setState({ mode:"speaking", heard:"", matchPct:0 });
  render();
  var speakerId = cue.type==="direction" ? "narrator" : (cue.characterId || cue.characterRaw || "narrator");
  VoiceEngine.speak(cue.text, speakerId, state.settings.rate, function(){
    if(state.mode!=="speaking") return; // user paused / navigated away mid-utterance
    afterAutoCue();
  });
}

function afterAutoCue(){
  var nextIndex = state.cueIndex + 1;
  setState({ cueIndex: nextIndex });
  maybeOfferSkip(nextIndex, function(){
    advance();
  });
}

function beginListening(cue){
  setState({ mode:"listening", heard:"", matchPct:0, micDenied:false });
  if(!ListenEngine.supported){
    return; // stays in "listening" UI with manual Next button only
  }
  var ok = ListenEngine.start({
    silenceMs: state.settings.silenceMs,
    onUpdate: function(text){
      var pct = Math.round(wordOverlap(cue.text, text)*100);
      state.heard = text;
      state.matchPct = pct;
      renderMatchOnly();
    },
    onSilence: function(text){
      if(state.mode!=="listening") return;
      ListenEngine.stop();
      var nextIndex = state.cueIndex + 1;
      setState({ cueIndex: nextIndex, mode:"idle", heard:"", matchPct:0 });
      maybeOfferSkip(nextIndex, function(){ advance(); });
    },
    onError: function(errType){
      if(state.mode!=="listening") return;
      setState({ micDenied:true });
    }
  });
  if(!ok){ setState({ micDenied:true }); }
}

function skipMyLine(){
  stopEngines();
  var nextIndex = state.cueIndex + 1;
  setState({ cueIndex: nextIndex, mode:"idle", heard:"", matchPct:0 });
  maybeOfferSkip(nextIndex, function(){ advance(); });
}

function restartListening(){
  var s = currentScript();
  var cue = s.cues[state.cueIndex];
  if(!cue || !isMyLine(cue)) return;
  ListenEngine.stop();
  beginListening(cue);
}

function jumpToIndex(idx){
  stopEngines();
  setState({ cueIndex: idx, modal:null, mode:"idle", skipDeclinedForIndex:null });
  advance();
}

/* ---------------------------------------------------------------------
   Import flow
--------------------------------------------------------------------- */
function importFromText(text, name){
  var pages = [];
  var CHUNK = 42;
  var lines = text.split(/\r?\n/);
  for(var i=0;i<lines.length;i+=CHUNK){
    pages.push({ pageNum: Math.floor(i/CHUNK)+1, text: lines.slice(i,i+CHUNK).join("\n") });
  }
  if(!pages.length) pages.push({pageNum:1, text:text});
  var rawCues = parseGenericPages(pages);
  var script = buildScriptFromRawCues(rawCues, { name:name, sourceType:"text", estimatedPages:true });
  finishImport(script);
}

function importFromHTML(htmlText, name){
  var doc = new DOMParser().parseFromString(htmlText, "text/html");
  var rawCues;
  if(looksLikeStructuredHTML(doc)){
    rawCues = parseStructuredHTML(doc);
  } else {
    var text = doc.body ? doc.body.textContent : htmlText;
    return importFromText(text, name);
  }
  var script = buildScriptFromRawCues(rawCues, { name:name, sourceType:"html", estimatedPages:false });
  finishImport(script);
}

function importFromPDF(file, name){
  setState({ screen:"upload", importing:true });
  readFileAsArrayBuffer(file).then(function(buf){
    return extractPdfPages(buf);
  }).then(function(pages){
    var rawCues = parseGenericPages(pages);
    var script = buildScriptFromRawCues(rawCues, { name:name, sourceType:"pdf", estimatedPages:false });
    finishImport(script);
  }).catch(function(err){
    setState({ importing:false, modal:{ type:"error", msg: err.message || "Couldn't read that PDF. Try pasting the script text instead." } });
  });
}

function finishImport(script){
  if(!script.characters.length){
    setState({ importing:false, modal:{ type:"error", msg:"Couldn't find any character cues in that script. Try pasting the text, or check that character names appear in capitals before each line." } });
    return;
  }
  var list = state.scripts.slice();
  list.push(script);
  saveScripts(list);
  var last = loadLast(); last.scriptId = script.id; saveLast(last);
  setState({ scripts:list, activeScriptId:script.id, screen:"characters", pendingSelectChar:null, importing:false });
}

function deleteScript(scriptId){
  var list = state.scripts.filter(function(s){ return s.id!==scriptId; });
  saveScripts(list);
  var last = loadLast();
  if(last.scriptId===scriptId){ last.scriptId=null; last.characterId=null; saveLast(last); }
  setState({ scripts:list, screen: list.length? "menu":"upload" });
}

/* ---------------------------------------------------------------------
   Character editing (fix mis-merged aliases)
--------------------------------------------------------------------- */
function renameCharacter(scriptId, charId, newName){
  var list = state.scripts.slice();
  var s = list.find(function(x){ return x.id===scriptId; });
  var c = s.characters.find(function(x){ return x.id===charId; });
  c.name = newName || c.name;
  saveScripts(list);
  setState({ scripts:list });
}

function detachAlias(scriptId, charId, alias){
  var list = state.scripts.slice();
  var s = list.find(function(x){ return x.id===scriptId; });
  var c = s.characters.find(function(x){ return x.id===charId; });
  if(c.aliases.length<=1) return;
  c.aliases = c.aliases.filter(function(a){ return a!==alias; });
  var newId = "c"+uid();
  var movedCount = 0;
  s.cues.forEach(function(cue){
    if(cue.characterId===charId && toTitle(cue.characterRaw)===alias){
      cue.characterId = newId; movedCount++;
    }
  });
  c.lineCount = Math.max(0, c.lineCount - movedCount);
  s.characters.push({ id:newId, name:alias, aliases:[alias], lineCount:movedCount, firstPage:1 });
  saveScripts(list);
  setState({ scripts:list });
}

function mergeCharacters(scriptId, fromId, intoId){
  if(fromId===intoId) return;
  var list = state.scripts.slice();
  var s = list.find(function(x){ return x.id===scriptId; });
  var from = s.characters.find(function(x){ return x.id===fromId; });
  var into = s.characters.find(function(x){ return x.id===intoId; });
  s.cues.forEach(function(cue){ if(cue.characterId===fromId) cue.characterId = intoId; });
  into.aliases = into.aliases.concat(from.aliases);
  into.lineCount += from.lineCount;
  s.characters = s.characters.filter(function(x){ return x.id!==fromId; });
  saveScripts(list);
  setState({ scripts:list, editingCharId:null, modal:null });
}

/* =========================================================================
   RENDERING
   ========================================================================= */
function render(){
  root.innerHTML = "";
  var wrap = document.createElement("div");
  wrap.className = "shell";
  wrap.innerHTML = renderScreen();
  root.appendChild(wrap);
  bindEvents(wrap);
  if(state.modal) renderModalInto(wrap);
}

function renderMatchOnly(){
  var bar = document.querySelector('[data-live-match]');
  var heardEl = document.querySelector('[data-live-heard]');
  if(bar) bar.style.width = Math.min(100,state.matchPct)+"%";
  if(heardEl) heardEl.textContent = state.heard ? ('"'+state.heard+'"') : "";
}

function renderScreen(){
  switch(state.screen){
    case "upload": return screenUpload();
    case "menu": return screenMenu();
    case "characters": return screenCharacters();
    case "rehearsal": return screenRehearsal();
    case "settings": return screenSettings();
    default: return screenUpload();
  }
}

function topbar(title, sub, leftIcon, leftAction){
  return '' +
  '<div class="topbar">' +
    (leftIcon ? '<button class="icon-btn" data-act="'+leftAction+'">'+leftIcon+'</button>' : '') +
    '<div class="title">'+esc(title)+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</div>' +
  '</div>';
}

function screenUpload(){
  var hasScripts = state.scripts.length>0;
  return '' +
  (hasScripts ? topbar("Add a script","","‹","go-menu") : '') +
  '<div class="screen">' +
    '<div class="center-stage">' +
      '<div class="spotlight"></div>' +
      '<div class="eyebrow">Cue</div>' +
      '<h1 class="hero">Bring in a script</h1>' +
      '<p class="lede">Upload a PDF or text export of the script. SilkCue will find every character and every line for you.</p>' +
      (state.importing ? '<p class="lede" style="color:var(--brass-bright)">Reading the script and finding characters…</p>' : '') +

        '📄 Drop a PDF or .txt file here, or tap to choose one' +
        '<input type="file" id="fileInput" accept=".pdf,.txt,.html,.htm" style="display:none">' +
      '</label>' +
      '<div class="or-row">or</div>' +
      '<textarea class="script-paste" id="pasteBox" placeholder="…or paste the script text right here"></textarea>' +
      '<div style="height:14px"></div>' +
      '<button class="btn btn-primary btn-block" data-act="import-paste">Use pasted text</button>' +
    '</div>' +
  '</div>';
}

function scriptSwatchLetter(name){ return (name||"?").trim().charAt(0).toUpperCase(); }

function screenMenu(){
  var last = loadLast();
  var lastScript = last.scriptId ? state.scripts.find(function(s){ return s.id===last.scriptId; }) : null;
  var lastChar = lastScript && last.characterId ? lastScript.characters.find(function(c){ return c.id===last.characterId; }) : null;

  var html = topbar("SilkCue","Your scripts");
  html += '<div class="screen"><div class="pad" style="padding-top:2px;padding-left:0;padding-right:0">';

  if(lastScript && lastChar){
    html += '<div class="continue-card">' +
      '<div class="k">Pick up where you left off</div>' +
      '<h3>'+esc(lastScript.name)+'</h3>' +
      '<p>Rehearsing as '+esc(lastChar.name)+'</p>' +
      '<button class="btn btn-primary" data-act="continue-last" style="background:var(--cream);color:var(--curtain)">Continue rehearsing</button>' +
    '</div>';
  }

  html += '<div class="list-heading">All scripts</div>';
  state.scripts.slice().sort(function(a,b){return b.addedAt-a.addedAt;}).forEach(function(s){
    html += '<button class="script-card" data-act="open-script" data-id="'+s.id+'">' +
      '<div class="swatch">'+scriptSwatchLetter(s.name)+'</div>' +
      '<div class="meta"><div class="name">'+esc(s.name)+'</div>' +
      '<div class="sub">'+s.characters.length+' characters · '+s.cues.filter(function(c){return c.type==="line";}).length+' lines</div></div>' +
      '<div class="chev">›</div>' +
    '</button>';
  });

  html += '<button class="fab-add" data-act="go-upload">+ Add another script</button>';
  html += '</div></div>';
  return html;
}

function screenCharacters(){
  var s = currentScript();
  if(!s) return screenUpload();
  var html = topbar(s.name, s.characters.length+" characters found", "‹", "go-menu");
  html += '<div class="screen">';
  html += '<div class="char-grid">';
  s.characters.forEach(function(c){
    var sel = state.pendingSelectChar===c.id;
    html += '<div>';
    html += '<button class="char-card'+(sel?' selected':'')+'" data-act="pick-char" data-id="'+c.id+'">' +
      '<span class="mark">'+(sel?'✓':'')+'</span>' +
      '<span class="cinfo"><span class="nm">'+esc(c.name)+'</span>' +
      '<span class="ln">'+c.lineCount+' line'+(c.lineCount===1?'':'s')+(c.aliases.length>1?' · also billed as '+esc(c.aliases.filter(function(a){return a!==c.name;}).join(", ")):'')+'</span></span>' +
      '<span class="editbtn" data-act="edit-char" data-id="'+c.id+'">Edit</span>' +
    '</button>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="sticky-footer">' +
    '<button class="btn btn-primary btn-block" data-act="confirm-char" '+(state.pendingSelectChar?'':'disabled')+'>Confirm & start</button>' +
  '</div>';
  html += '</div>';
  return html;
}

function speakerLabel(s, cue){
  if(cue.type==="direction") return "";
  if(cue.type==="heading") return "";
  if(!cue.characterId) return "Narrator";
  var c = s.characters.find(function(x){ return x.id===cue.characterId; });
  return c ? c.name : (cue.characterRaw||"");
}

function screenRehearsal(){
  var s = currentScript();
  var ch = currentCharacter();
  if(!s || !ch) return screenMenu();
  var cue = s.cues[state.cueIndex] || null;

  var html = '<div class="rehearsal-head">' +
    '<button class="icon-btn" data-act="go-menu">‹</button>' +
    '<div class="who"><div class="role">Playing '+esc(ch.name)+'</div>' +
      '<div class="pg">'+(cue?('Page '+cue.page+(s.estimatedPages?' (approx.)':'')):'')+'</div></div>' +
    '<button class="icon-btn" data-act="open-settings" title="Settings">⚙</button>' +
  '</div>';

  html += '<div class="screen"><div class="page-panel"><div class="script-sheet">';

  var from = Math.max(0, state.cueIndex-4);
  var to = Math.min(s.cues.length, state.cueIndex+3);
  for(var i=from;i<to;i++){
    var c = s.cues[i];
    var isCur = i===state.cueIndex;
    var label = speakerLabel(s,c);
    var mine = isMyLine(c);
    var cls = "cue-line" + (isCur?" current":" ctx") + (c.type==="direction"?" direction":"") + (c.type==="heading"?" heading":"") + (mine?" mine":"");
    if(c.type==="heading"){
      html += '<div class="'+cls+'">'+esc(c.text)+'</div>';
      continue;
    }
    if(c.type==="direction"){
      html += '<div class="'+cls+'">('+esc(c.text)+')</div>';
      continue;
    }
    if(c.type==="text"){
      html += '<p class="'+cls+'">'+esc(c.text)+'</p>';
      continue;
    }
    var hideThis = mine && state.settings.hideOwnLines && !(isCur && state.mode!=="listening");
    html += '<p class="'+cls+(hideThis?' hidden-text':'')+'">' +
      '<span class="who">'+esc(label)+'. </span>' +
      '<span class="txt">'+esc(c.text)+'</span>';
    if(isCur && mine && state.mode==="listening"){
      html += '<div class="matchbar"><i data-live-match style="width:'+Math.min(100,state.matchPct)+'%"></i></div>';
      html += '<div class="heard" data-live-heard>'+(state.heard?('"'+esc(state.heard)+'"'):"")+'</div>';
    }
    html += '</p>';
  }
  if(to>=s.cues.length){
    html += '<div class="cue-line direction">— end of script —</div>';
  }
  html += '</div></div>';

  // transport
  html += '<div class="transport">';
  html += '<div class="status-row">'+statusRow()+'</div>';
  html += '<div class="ctrl-row">';
  if(state.mode==="paused"){
    html += '<button class="btn btn-primary" data-act="resume">▶ Resume</button>';
  } else {
    html += '<button class="btn btn-ghost" data-act="pause">⏸ Pause</button>';
  }
  if(state.mode==="listening"){
    html += '<button class="btn icon-only btn-ghost" data-act="restart-listening" title="Restart my line">↻</button>';
    html += '<button class="btn btn-primary" data-act="skip-my-line">Done — next line</button>';
  } else {
    html += '<button class="btn btn-ghost" data-act="open-jump">Jump to…</button>';
  }
  html += '</div>';
  if(!ListenEngine.supported && state.mode==="listening"){
    html += '<div class="banner" style="margin:8px 0 0">Voice cueing isn\'t supported in this browser. Use the button above when you\'re done with your line.</div>';
  }
  if(ListenEngine.supported && state.micDenied && state.mode==="listening"){
    html += '<div class="banner" style="margin:8px 0 0">Couldn\'t access the microphone — check permissions for this page, then tap ↻ to try again. You can always use the button above to move on.</div>';
  }
  html += '</div>';

  return html;
}

function statusRow(){
  if(state.mode==="speaking") return '<span class="pulse-dot speaking"></span> Reading the other lines…';
  if(state.mode==="listening") return '<span class="pulse-dot listening"></span> Listening for your line…';
  if(state.mode==="paused") return '<span class="pulse-dot"></span> Paused';
  return '<span class="pulse-dot"></span> Ready';
}

function screenSettings(){
  var t = state.settings;
  var html = topbar("Settings","","‹","go-back-rehearsal");
  html += '<div class="screen"><div class="pad">';

  html += '<div class="settings-row"><div><div class="lbl">Auto-skip long gaps</div><div class="desc">Offer to jump ahead when your character is out for 2+ pages</div></div>' +
    '<button class="switch'+(t.autoSkip?' on':'')+'" data-act="toggle-autoskip"><i></i></button></div>';

  html += '<div class="settings-row"><div><div class="lbl">Hide my lines</div><div class="desc">Black out your own lines until it\'s your turn, for blind recall</div></div>' +
    '<button class="switch'+(t.hideOwnLines?' on':'')+'" data-act="toggle-hide"><i></i></button></div>';

  html += '<div class="settings-row" style="display:block"><div class="lbl">Reading speed — '+t.rate.toFixed(2)+'×</div>' +
    '<input type="range" min="0.6" max="1.6" step="0.05" value="'+t.rate+'" data-act="set-rate"></div>';

  html += '<div class="settings-row" style="display:block"><div class="lbl">Pause before advancing — '+(t.silenceMs/1000).toFixed(1)+'s</div>' +
    '<div class="desc">How long a silence means you\'ve finished your line</div>' +
    '<input type="range" min="800" max="3000" step="100" value="'+t.silenceMs+'" data-act="set-silence"></div>';

  html += '<div style="height:8px"></div>';
  html += '<button class="btn btn-danger btn-block" data-act="delete-current-script">Delete this script</button>';

  html += '</div></div>';
  return html;
}

/* ---------------------------------------------------------------------
   Modal rendering
--------------------------------------------------------------------- */
function renderModalInto(wrap){
  var m = state.modal;
  if(!m) return;
  var back = document.createElement("div");
  back.className = "modal-back";
  var body = "";

  if(m.type==="skip"){
    var s = currentScript();
    body = '<div class="modal-card">' +
      '<h3>Your character is off for a while</h3>' +
      '<p>They don\'t speak again until around page '+m.targetPage+'. Skip ahead, or keep reading through it?</p>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-ghost" data-act="skip-decline">Keep reading</button>' +
        '<button class="btn btn-primary" data-act="skip-accept">Skip ahead</button>' +
      '</div></div>';
  } else if(m.type==="end"){
    body = '<div class="modal-card">' +
      '<h3>That\'s the end of your lines</h3>' +
      '<p>You\'ve reached the last cue for this character in the script.</p>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-ghost" data-act="restart-scene">Start over</button>' +
        '<button class="btn btn-primary" data-act="go-menu">Back to scripts</button>' +
      '</div></div>';
  } else if(m.type==="error"){
    body = '<div class="modal-card">' +
      '<h3>Something went wrong</h3>' +
      '<p>'+esc(m.msg)+'</p>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-primary btn-block" data-act="dismiss-modal">Got it</button>' +
      '</div></div>';
  } else if(m.type==="jump"){
    var sc = currentScript();
    body = '<div class="modal-card">' +
      '<h3>Jump to a scene</h3>' +
      '<div style="max-height:50vh;overflow-y:auto">';
    if(!sc.headings.length){
      body += '<p>No scene markers were found in this script.</p>';
    }
    sc.headings.forEach(function(h){
      var idx = sc.cues.findIndex(function(c){return c.id===h.cueId;});
      body += '<button class="btn btn-ghost btn-block" style="margin-bottom:8px;justify-content:flex-start" data-act="jump-to" data-idx="'+idx+'">'+esc(h.text)+' <span style="margin-left:auto;color:#8a7d68;font-size:12px">p.'+h.page+'</span></button>';
    });
    body += '</div>' +
      '<button class="btn btn-ghost btn-block" data-act="dismiss-modal" style="margin-top:8px">Cancel</button>' +
    '</div>';
  } else if(m.type==="editChar"){
    var scr = currentScript();
    var ch = scr.characters.find(function(c){return c.id===m.charId;});
    body = '<div class="modal-card">' +
      '<h3>Edit character</h3>' +
      '<div class="field-label">Display name</div>' +
      '<input class="text-input" id="editNameInput" value="'+esc(ch.name)+'">' +
      '<div class="field-label">SilkCue labels grouped here</div>' +
      '<div class="chip-row">' + ch.aliases.map(function(a){
        return '<span class="chip">'+esc(a)+(ch.aliases.length>1?' <button data-act="detach-alias" data-alias="'+esc(a)+'">×</button>':'')+'</span>';
      }).join("") + '</div>';
    var others = scr.characters.filter(function(c){return c.id!==ch.id;});
    if(others.length){
      body += '<div class="field-label">Merge into another character</div>' +
        '<select class="text-input" id="mergeSelect"><option value="">— choose —</option>' +
        others.map(function(o){ return '<option value="'+o.id+'">'+esc(o.name)+'</option>'; }).join("") +
        '</select>';
    }
    body += '<div class="modal-actions" style="margin-top:18px">' +
        '<button class="btn btn-ghost" data-act="dismiss-modal">Close</button>' +
        '<button class="btn btn-primary" data-act="save-char-edit" data-id="'+ch.id+'">Save</button>' +
      '</div></div>';
  }

  back.innerHTML = body;
  wrap.appendChild(back);
  if(m.type==="editChar"){
    var sel = back.querySelector("#mergeSelect");
    if(sel) sel.addEventListener("change", function(){
      if(sel.value){ mergeCharacters(currentScript().id, m.charId, sel.value); }
    });
  }
}

/* ---------------------------------------------------------------------
   Event binding (delegated)
--------------------------------------------------------------------- */
function bindEvents(wrap){
  wrap.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-act]");
    if(!el) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");

    switch(act){
      case "go-upload": goToScreen("upload"); break;
      case "go-menu": goToScreen("menu"); break;
      case "go-back-rehearsal": setState({ screen:"rehearsal" }); break;
      case "open-settings": setState({ screen:"settings" }); break;

      case "open-script":
        setState({ activeScriptId:id, screen:"characters", pendingSelectChar:null });
        break;

      case "continue-last":
        var last = loadLast();
        startRehearsal(last.scriptId, last.characterId, 0);
        break;

      case "pick-char":
        setState({ pendingSelectChar:id });
        break;

      case "edit-char":
        ev.stopPropagation();
        setState({ modal:{ type:"editChar", charId:id } });
        break;

      case "confirm-char":
        if(state.pendingSelectChar){
          startRehearsal(state.activeScriptId, state.pendingSelectChar, 0);
        }
        break;

      case "import-paste":
        var txt = wrap.querySelector("#pasteBox").value.trim();
        if(txt) importFromText(txt, "Pasted script");
        break;

      case "pause": pauseRehearsal(); break;
      case "resume": resumeRehearsal(); break;
      case "skip-my-line": skipMyLine(); break;
      case "restart-listening": restartListening(); break;
      case "open-jump": setState({ modal:{ type:"jump" } }); break;
      case "jump-to": jumpToIndex(parseInt(el.getAttribute("data-idx"),10)); break;
      case "restart-scene": jumpToIndex(0); break;

      case "skip-accept":
        var m = state.modal;
        jumpToIndex(m.targetIndex);
        break;
      case "skip-decline":
        var m2 = state.modal;
        setState({ modal:null, skipDeclinedForIndex: m2.userLineIndex });
        advance();
        break;
      case "dismiss-modal": setState({ modal:null }); break;

      case "detach-alias":
        ev.stopPropagation();
        detachAlias(currentScript().id, state.modal.charId, el.getAttribute("data-alias"));
        break;
      case "save-char-edit":
        var nameVal = wrap.querySelector("#editNameInput").value.trim();
        renameCharacter(currentScript().id, id, nameVal);
        setState({ modal:null });
        break;

      case "toggle-autoskip":
        state.settings.autoSkip = !state.settings.autoSkip; saveSettings(state.settings); render(); break;
      case "toggle-hide":
        state.settings.hideOwnLines = !state.settings.hideOwnLines; saveSettings(state.settings); render(); break;

      case "delete-current-script":
        if(confirm("Delete this script and all its rehearsal data?")){
          deleteScript(currentScript().id);
        }
        break;
    }
  });

  wrap.addEventListener("input", function(ev){
    if(ev.target.getAttribute("data-act")==="set-rate"){
      state.settings.rate = parseFloat(ev.target.value); saveSettings(state.settings);
      var lbl = ev.target.previousElementSibling; // .lbl text node sibling not directly; cheap refresh:
      render();
    }
    if(ev.target.getAttribute("data-act")==="set-silence"){
      state.settings.silenceMs = parseInt(ev.target.value,10); saveSettings(state.settings);
      render();
    }
  });

  var dz = wrap.querySelector("#dropzone");
  var fi = wrap.querySelector("#fileInput");
  if(dz && fi){
    dz.addEventListener("click", function(){}); // label already triggers input
    fi.addEventListener("change", function(){
      var file = fi.files[0];
      if(!file) return;
      handleUploadedFile(file);
    });
    dz.addEventListener("dragover", function(ev){ ev.preventDefault(); dz.classList.add("drag"); });
    dz.addEventListener("dragleave", function(){ dz.classList.remove("drag"); });
    dz.addEventListener("drop", function(ev){
      ev.preventDefault(); dz.classList.remove("drag");
      var file = ev.dataTransfer.files[0];
      if(file) handleUploadedFile(file);
    });
  }
}

function handleUploadedFile(file){
  var name = file.name.replace(/\.[^.]+$/,"");
  var lower = file.name.toLowerCase();
  if(lower.endsWith(".pdf")){
    importFromPDF(file, name);
  } else if(lower.endsWith(".html") || lower.endsWith(".htm")){
    readFileAsText(file).then(function(txt){ importFromHTML(txt, name); });
  } else {
    readFileAsText(file).then(function(txt){ importFromText(txt, name); });
  }
}

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
function boot(){
  state.scripts = loadScripts();
  var last = loadLast();
  if(state.scripts.length){
    state.screen = "menu";
    state.activeScriptId = last.scriptId || state.scripts[0].id;
  } else {
    state.screen = "upload";
  }
  render();

  // best-effort service worker / installability — silently ignored where unsupported
  try{
    if("serviceWorker" in navigator){
      var swSrc = "self.addEventListener('install',function(e){self.skipWaiting();});" +
                  "self.addEventListener('activate',function(e){self.clients.claim();});" +
                  "self.addEventListener('fetch',function(e){});";
      var blob = new Blob([swSrc], { type:"application/javascript" });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
    }
    var manifest = {
      name: "SilkCue - Open Source Line Learning for Actors",
      short_name: "SilkCue",
      start_url: ".",
      display: "standalone",
      background_color: "#14110d",
      theme_color: "#14110d",
      icons: []
    };
    var mBlob = new Blob([JSON.stringify(manifest)], { type:"application/manifest+json" });
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(mBlob);
    document.head.appendChild(link);
  }catch(e){}
}

boot();
})();
</script>
